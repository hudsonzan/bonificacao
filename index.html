<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conferência de Bonificação</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#1B2430; --paper:#F6F4EF; --lens:#2F6F80; --lens-bright:#48A0B5;
    --amber:#D98E3B; --line:#DAD5C8; --ink-soft:#63707F; --error:#B5502E;
    --ok:#3C8462; --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);font-family:'Inter',sans-serif;color:var(--ink);}
  .cbf-root{max-width:720px;margin:0 auto;min-height:100vh;}
  .cbf-header{
    background:var(--ink); color:var(--paper); padding:20px 24px 18px;
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px;
    position:sticky; top:0; z-index:10;
  }
  .cbf-title{font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:0.2px;}
  .cbf-title small{display:block;font-family:'Inter',sans-serif;font-weight:400;font-size:12px;color:#B7C4CE;margin-top:4px;text-transform:uppercase;letter-spacing:1.2px;}
  .cbf-tabs{display:flex;gap:6px;background:rgba(255,255,255,0.08);padding:4px;border-radius:999px;}
  .cbf-tab{border:none;background:transparent;color:#C9D3DA;padding:8px 16px;border-radius:999px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;transition:all .2s ease;}
  .cbf-tab.active{background:var(--amber);color:var(--ink);}
  .cbf-body{padding:22px 24px 40px;}
  @media(max-width:640px){ .cbf-body{padding:16px;} .cbf-header{padding:16px;} }
  .cbf-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .cbf-card h3{margin:0 0 4px;font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--ink);}
  .cbf-label{font-size:12px;text-transform:uppercase;letter-spacing:0.8px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;display:block;}
  select, input[type=text], input[type=password], input[type=number], textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    font-family:'Inter',sans-serif;font-size:14px;background:#FCFBF8;color:var(--ink);
  }
  textarea{font-family:'IBM Plex Mono',monospace;font-size:12.5px;min-height:90px;resize:vertical;}
  select:focus, input:focus, textarea:focus{outline:2px solid var(--lens-bright);outline-offset:1px;}
  .cbf-btn{border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:'Inter',sans-serif;transition:transform .12s ease, opacity .12s ease;}
  .cbf-btn:active{transform:scale(0.97);}
  .cbf-btn-primary{background:var(--lens);color:#fff;}
  .cbf-btn-primary:hover{background:var(--lens-bright);}
  .cbf-btn-amber{background:var(--amber);color:var(--ink);}
  .cbf-btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .cbf-btn-danger{background:transparent;color:var(--error);border:1px solid var(--error);}
  .cbf-btn[disabled]{opacity:0.5;cursor:not-allowed;}
  .cbf-lens-wrap{display:flex;align-items:center;gap:16px;margin:12px 0 8px;}
  .cbf-lens{width:52px;height:52px;border-radius:50%;flex:none;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;transition:border-color .35s ease, box-shadow .35s ease;}
  .cbf-lens::after{content:'';width:16px;height:16px;border-radius:50%;background:var(--line);transition:background .35s ease;}
  .cbf-lens.ok{border-color:var(--ok);box-shadow:0 0 0 6px rgba(60,132,98,0.12);}
  .cbf-lens.ok::after{background:var(--ok);}
  .cbf-lens.warn{border-color:var(--amber);box-shadow:0 0 0 6px rgba(217,142,59,0.14);}
  .cbf-lens.warn::after{background:var(--amber);}
  .cbf-lens.err{border-color:var(--error);box-shadow:0 0 0 6px rgba(181,80,46,0.12);}
  .cbf-lens.err::after{background:var(--error);}
  .cbf-lens.pulse{animation:cbfPulse .5s ease;}
  @keyframes cbfPulse{0%{transform:scale(1);}45%{transform:scale(1.12);}100%{transform:scale(1);}}
  .cbf-seq-row{display:flex;gap:10px;flex:1;flex-wrap:wrap;}
  .cbf-seq-row input{flex:1;min-width:140px;font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:0.5px;}
  .cbf-result{min-height:20px;font-size:13px;margin-bottom:2px;}
  .cbf-result.ok{color:var(--ok);}
  .cbf-result.err{color:var(--error);}
  .cbf-result.warn{color:var(--amber);}
  .cbf-total{font-family:'Fraunces',serif;font-weight:700;font-size:26px;color:var(--ink);}
  .cbf-total.big{font-size:32px;}
  .cbf-total small{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;color:var(--ink-soft);display:block;text-transform:uppercase;letter-spacing:1px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-soft);padding:6px 8px;border-bottom:1px solid var(--line);}
  td{padding:6px 8px;border-bottom:1px solid #EDEAE1;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  td.mono-name{font-family:'Inter',sans-serif;}
  tr:last-child td{border-bottom:none;}
  .cbf-empty{color:var(--ink-soft);font-size:12.5px;padding:10px 2px;}
  .cbf-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:640px){.cbf-grid2{grid-template-columns:1fr;}}
  .cbf-pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:600;background:#EFEBE0;color:var(--ink-soft);white-space:nowrap;}
  .cbf-pill-ok{background:#DFEEE5;color:var(--ok);}
  .cbf-pill-warn{background:#F5E7D4;color:#95611E;}
  .cbf-pill-err{background:#F3DFD7;color:var(--error);}
  .cbf-hint{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
  .cbf-locked{padding:40px 10px;text-align:center;}
  .cbf-flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .cbf-pending-note{font-size:12px;color:var(--amber);font-weight:600;margin-top:6px;}
  .cbf-eyebrow{font-size:17px;font-weight:700;letter-spacing:0.4px;color:var(--lens);font-family:'Fraunces',serif;}
  .cbf-badge-code{display:inline-block;background:var(--ink);color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:3px 9px;border-radius:6px;letter-spacing:0.5px;}
  .cbf-welcome{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .cbf-welcome-name{font-family:'Fraunces',serif;font-weight:600;font-size:17px;}
</style>

let lastError = '';

monthLabel.textContent = now.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});

// ---------- supabase helpers ----------
async function fetchAllRows(table, orderCol){
  let all = [];
  let from = 0;
  const pageSize = 1000;
  while(true){
    let query = supabase.from(table).select('*').range(from, from+pageSize-1);
    if(orderCol) query = query.order(orderCol, {ascending:true});
    const { data, error } = await query;
    if(error){ lastError = error.message; console.error(table, error); break; }
    all = all.concat(data||[]);
    if(!data || data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}

async function deleteAll(table, pkCol){
  const { error } = await supabase.from(table).delete().not(pkCol, 'is', null);
  if(error){ lastError = error.message; return false; }
  return true;
}

async function batchInsert(table, rows, batchSize){
  for(let i=0;i<rows.length;i+=batchSize){
    const batch = rows.slice(i, i+batchSize);
    const { error } = await supabase.from(table).insert(batch);
    if(error){ lastError = error.message; console.error(table, error); return false; }
  }
  return true;
}

async function batchUpsert(table, rows, pkCol, batchSize){
  for(let i=0;i<rows.length;i+=batchSize){
    const batch = rows.slice(i, i+batchSize);
    const { error } = await supabase.from(table).upsert(batch, {onConflict:pkCol});
    if(error){ lastError = error.message; console.error(table, error); return false; }
  }
  return true;
}

async function replaceTable(table, pkCol, rows, batchSize){
  const ok1 = await deleteAll(table, pkCol);
  if(!ok1) return false;
  if(rows.length===0) return true;
  return await batchInsert(table, rows, batchSize);
}

async function loadReferenceData(){
  state.sellers = await fetchAllRows('sellers');
  state.refVendas = await fetchAllRows('ref_vendas');
  state.refCF = await fetchAllRows('ref_cf', 'ordem');
  state.bonusSku = await fetchAllRows('bonus_sku');
  state.bonusMarca = await fetchAllRows('bonus_marca');
  state.baleiaEspeciais = await fetchAllRows('baleia_especiais');
  const { data: settingsRows, error } = await supabase.from('settings').select('*').eq('id',1).limit(1);
  if(!error && settingsRows && settingsRows[0]){
    state.settings = { descontoMax: Number(settingsRows[0].desconto_max), valorCF: Number(settingsRows[0].valor_cf), valorBaleiaEspecial: Number(settingsRows[0].valor_baleia_especial||10), xrDescontoMin: Number(settingsRows[0].xr_desconto_min||40), xrDescontoMax: Number(settingsRows[0].xr_desconto_max||55) };
  }
  state.refDataLoaded = true;
}

async function loadEntries(){
  state.entries = await fetchAllRows('entries');
}

// ---------- utils ----------
function norm(s){ return (s||'').toString().trim().toLowerCase(); }
function parseValor(str){
  if(str===undefined||str===null) return 0;
  let s = str.toString().replace(/[^\d,.-]/g,'');
  if(s.includes(',') && s.includes('.')){ s = s.replace(/\./g,'').replace(',', '.'); }
  else if(s.includes(',')){ s = s.replace(',', '.'); }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function fmtBRL(n){ return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function splitLine(line){
  const delim = line.includes(';') ? ';' : (line.includes('\t') ? '\t' : ',');
  return line.split(delim).map(c=>c.trim().replace(/^"|"$/g,''));
}
function toLines(text){
  return (text||'').split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim().length>0);
}
function isHeaderRow(cols){
  const j = norm(cols.join(' '));
  return j.includes('seq') || j.includes('vendedor') || j.includes('codigo') || j.includes('código') || j.includes('marca') || j.includes('valor') || j.includes('nome') || j.includes('qtde') || j.includes('desconto');
}
function nomeDoVendedor(codigo){
  const s = state.sellers.find(x => norm(x.codigo) === norm(codigo));
  return s ? s.nome : ('Código ' + codigo);
}

function parseRefVendas(text){
  return toLines(text).filter(l=>{const c=splitLine(l); return !isHeaderRow(c);}).map(l=>{
    const c = splitLine(l);
    return { seq:(c[0]||'').trim(), vcodigo:(c[1]||'').trim(), produto:(c[2]||'').trim(), descricao:(c[3]||'').trim(), pct: parseValor(c[4]) };
  }).filter(r=>r.seq);
}
function parseRefCF(text){
  return toLines(text).filter(l=>{const c=splitLine(l); return !isHeaderRow(c);}).map((l,i)=>{
    const c = splitLine(l);
    return { ordem:i, seq:(c[0]||'').trim(), vcodigo:(c[1]||'').trim(), produto:(c[2]||'').trim(), descricao:(c[3]||'').trim(), qtde: parseValor(c[4]) };
  }).filter(r=>r.seq);
}
function parseBonusSku(text){
  return toLines(text).filter(l=>{const c=splitLine(l); return !isHeaderRow(c);}).map(l=>{
    const c = splitLine(l);
    return { codigo:(c[0]||'').trim(), valor: parseValor(c[1]) };
  }).filter(r=>r.codigo);
}
function parseBonusMarca(text){
  return toLines(text).filter(l=>{const c=splitLine(l); return !isHeaderRow(c);}).map(l=>{
    const c = splitLine(l);
    return { marca:(c[0]||'').trim(), valor: parseValor(c[1]!==undefined?c[1]:'5,00') };
  }).filter(r=>r.marca);
}
function parseSellers(text){
  const seen = new Set();
  return toLines(text).filter(l=>{const c=splitLine(l); return !isHeaderRow(c);}).map(l=>{
    const c = splitLine(l);
    return { codigo:(c[0]||'').trim(), nome:(c[1]||'').trim() };
  }).filter(r=>{
    if(!r.codigo || seen.has(norm(r.codigo))) return false;
    seen.add(norm(r.codigo)); return true;
  });
}

// ---------- lookups ----------
function computeLentesBonus(ownRows){
  const detalhes = []; const notes = []; const itens = [];
  ownRows.forEach(r=>{
    const bs = state.bonusSku.find(b => norm(b.codigo) === norm(r.produto));
    if(bs){
      const pct = parseValor(r.pct);
      const isXR = /\bXR\b/i.test(r.descricao);
      if(pct <= state.settings.descontoMax + 1e-9){
        detalhes.push({ ref: r.produto + ' — ' + r.descricao, valor: Number(bs.valor) });
        itens.push(r.descricao);
      } else if(isXR && pct >= state.settings.xrDescontoMin - 1e-9 && pct <= state.settings.xrDescontoMax + 1e-9){
        const valorMeio = Number(bs.valor) / 2;
        detalhes.push({ ref: r.produto + ' — ' + r.descricao + ' (Meu 1° Varilux, 50%)', valor: valorMeio });
        itens.push(r.descricao + ' · 1° Varilux');
      } else {
        notes.push('Desconto de ' + pct.toFixed(2).replace('.',',') + '% no SKU ' + r.produto + ' passou do limite de ' + state.settings.descontoMax + '%.');
      }
    }
  });
  return { detalhes, notes, itens };
}

function computeBaleiaBonus(ownRows, vcodigo){
  const isEspecial = state.baleiaEspeciais.some(x => norm(x.vcodigo) === norm(vcodigo));
  const detalhes = []; const itens = [];
  ownRows.forEach(r=>{
    state.bonusMarca.forEach(b=>{
      if(b.marca && norm(r.descricao).includes(norm(b.marca))){
        const valor = isEspecial ? Number(state.settings.valorBaleiaEspecial) : Number(b.valor);
        detalhes.push({ ref: b.marca + ' (' + r.produto + ')' + (isEspecial ? ' · especial' : ''), valor });
        itens.push(b.marca);
      }
    });
  });
  return { detalhes, itens };
}

function computeCFBonus(ownRowsSorted){
  let pendingFrame = false; let pares = 0; let aroDeUsoCount = 0;
  ownRowsSorted.forEach(r=>{
    const isLens = (r.produto||'').toUpperCase().startsWith('LSA');
    const isAroDeUso = norm(r.descricao).includes('aro de uso');
    if(!isLens){
      if(isAroDeUso){ pendingFrame = false; aroDeUsoCount++; }
      else{ pendingFrame = true; }
    }
    else if(pendingFrame){ pares++; pendingFrame = false; }
  });
  return { pares, aroDeUsoCount };
}

function lookupLentes(seq, codigo){
  const rows = state.refVendas.filter(r => norm(r.seq) === norm(seq));
  if(rows.length === 0){
    if(state.refCF.some(r => norm(r.seq) === norm(seq))){
      return { status:'wrong_report', detalhes:[], total:0, note:'Essa SEQ é do relatório CF — lance no campo "3 · Vendas CF".', item:'' };
    }
    return { status:'pending', detalhes:[], total:0, note:'', item:'' };
  }
  const own = rows.filter(r => norm(r.vcodigo) === norm(codigo));
  if(own.length === 0) return { status:'rejected', detalhes:[], total:0, note:'Essa SEQ pertence a outro vendedor.', item:'' };
  const { detalhes, notes, itens } = computeLentesBonus(own);
  if(detalhes.length > 0) return { status:'resolved', detalhes, total: detalhes.reduce((s,d)=>s+d.valor,0), note: notes.join(' '), item: itens.join(' + ') };
  if(notes.length > 0) return { status:'no_bonus', detalhes:[], total:0, note: notes.join(' '), item:'' };
  return { status:'no_bonus', detalhes:[], total:0, note:'', item:'' };
}

function lookupBaleia(seq, codigo){
  const rows = state.refVendas.filter(r => norm(r.seq) === norm(seq));
  if(rows.length === 0){
    if(state.refCF.some(r => norm(r.seq) === norm(seq))){
      return { status:'wrong_report', detalhes:[], total:0, note:'Essa SEQ é do relatório CF — lance no campo "3 · Vendas CF".', item:'' };
    }
    return { status:'pending', detalhes:[], total:0, note:'', item:'' };
  }
  const own = rows.filter(r => norm(r.vcodigo) === norm(codigo));
  if(own.length === 0) return { status:'rejected', detalhes:[], total:0, note:'Essa SEQ pertence a outro vendedor.', item:'' };
  const { detalhes, itens } = computeBaleiaBonus(own, codigo);
  if(detalhes.length > 0) return { status:'resolved', detalhes, total: detalhes.reduce((s,d)=>s+d.valor,0), note:'', item: itens.join(' + ') };
  return { status:'no_bonus', detalhes:[], total:0, note:'', item:'' };
}

function lookupCF(seq, codigo){
  const rows = state.refCF.filter(r => norm(r.seq) === norm(seq)).sort((a,b)=>a.ordem-b.ordem);
  if(rows.length === 0){
    if(state.refVendas.some(r => norm(r.seq) === norm(seq))){
      return { status:'wrong_report', detalhes:[], total:0, note:'Essa SEQ é do relatório de Vendas — lance em "1 · Vendas de Lentes" ou "2 · Armações Baleias".', item:'' };
    }
    return { status:'pending', detalhes:[], total:0, note:'', item:'' };
  }
  const own = rows.filter(r => norm(r.vcodigo) === norm(codigo));
  if(own.length === 0) return { status:'rejected', detalhes:[], total:0, note:'Essa SEQ pertence a outro vendedor.', item:'' };
  const { pares, aroDeUsoCount } = computeCFBonus(own);
  if(pares <= 0) return { status:'no_bonus', detalhes:[], total:0, note: aroDeUsoCount ? 'Lente para armação de uso do cliente (aro de uso) não bonifica.' : '', item:'' };
  const total = pares * state.settings.valorCF;
  return { status:'resolved', detalhes:[{ ref: pares + ' par(es) completo(s) (armação + lentes)', valor: total }], total, note: aroDeUsoCount ? (aroDeUsoCount+' lente(s) de aro de uso não contadas.') : '', item: pares + ' par(es)' };
}

function recomputeEntry(e){
  if(e.manual) return e;
  let r;
  if(e.tipo === 'lentes') r = lookupLentes(e.seq, e.vcodigo);
  else if(e.tipo === 'baleia') r = lookupBaleia(e.seq, e.vcodigo);
  else r = lookupCF(e.seq, e.vcodigo);
  e.status = r.status; e.detalhes = r.detalhes; e.total = r.total; e.note = r.note; e.item = r.item || '';
  return e;
}

async function reconcileAll(){
  await loadEntries();
  state.entries = state.entries.map(e => recomputeEntry(e));
  await batchUpsert('entries', state.entries, 'id', 500);
}

function statusLabel(status, manual){
  if(manual) return {text:'Aprovada manualmente', cls:'cbf-pill-ok'};
  switch(status){
    case 'resolved': return {text:'Confirmada', cls:'cbf-pill-ok'};
    case 'pending': return {text:'Aguardando relatório', cls:'cbf-pill-warn'};
    case 'rejected': return {text:'Não pertence a você', cls:'cbf-pill-err'};
    case 'wrong_report': return {text:'Campo errado', cls:'cbf-pill-err'};
    case 'no_bonus': return {text:'Sem bonificação', cls:''};
    default: return {text:status||'—', cls:''};
  }
}
function dateStr(ts){ return new Date(ts).toLocaleDateString('pt-BR'); }
function escHtml(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function escAttr(s){ return (s??'').toString().replace(/"/g,'&quot;'); }

// ---------- render ----------
function render(){
  document.getElementById('tabVendedor').classList.toggle('active', state.currentTab==='vendedor');
  document.getElementById('tabAdmin').classList.toggle('active', state.currentTab==='admin');
  root.innerHTML = state.currentTab === 'vendedor' ? renderVendedor() : renderAdmin();
  attachHandlers();
}

function categoryHint(tipo){
  if(tipo==='lentes') return 'Paga o valor da tabela por SKU se o desconto da lente não passar de ' + state.settings.descontoMax + '%.';
  if(tipo==='baleia') return 'Paga o valor cadastrado por cada armação de marca "baleia" encontrada na SEQ.';
  return 'Paga ' + fmtBRL(state.settings.valorCF) + ' por lente, só quando vem pareada com uma armação (óculos completo).';
}

function renderCategoryCard(tipo){
  const meta = CATS[tipo];
  const myCode = state.currentSellerCode;
  const myEntries = state.entries.filter(e => e.tipo===tipo && norm(e.vcodigo) === norm(myCode)).sort((a,b)=>b.ts-a.ts);
  const subtotal = myEntries.reduce((s,e)=>s+Number(e.total),0);
  const pendingCount = myEntries.filter(e=>e.status==='pending').length;

  const rows = myEntries.length ? myEntries.map(e=>{
    const st = statusLabel(e.status, e.manual);
    return `<tr><td>${escHtml(e.seq)}</td><td class="mono-name" title="${escAttr(e.item||'')}">${escHtml((e.item||'').slice(0,28))}${(e.item||'').length>28?'…':''}</td><td class="mono-name"><span class="cbf-pill ${st.cls}">${st.text}</span></td><td>${fmtBRL(e.total)}</td><td class="mono-name">${dateStr(e.ts)}</td></tr>`;
  }).join('') : `<tr><td colspan="5" class="cbf-empty">Nenhuma SEQ lançada ainda.</td></tr>`;

  return `
    <div class="cbf-card">
      <div class="cbf-eyebrow">${meta.num} · ${meta.label}</div>
      <div class="cbf-hint">${categoryHint(tipo)}</div>
      <div class="cbf-lens-wrap">
        <div class="cbf-lens" id="lensRing-${tipo}"></div>
        <div class="cbf-seq-row">
          <input type="text" id="seqInput-${tipo}" placeholder="Digite a SEQ e aperte Enter" autocomplete="off">
          <button class="cbf-btn cbf-btn-primary" id="seqBtn-${tipo}">Conferir</button>
        </div>
      </div>
      <div class="cbf-result" id="seqResult-${tipo}"></div>
      ${pendingCount ? `<div class="cbf-pending-note">${pendingCount} aguardando relatório.</div>` : ''}
      <div class="cbf-flex-between" style="margin-top:10px;">
        <span class="cbf-label" style="margin:0;">Lançamentos</span>
        <div class="cbf-total"><small>Subtotal</small>${fmtBRL(subtotal)}</div>
      </div>
      <table><thead><tr><th>SEQ</th><th>Item</th><th>Status</th><th>Valor</th><th>Data</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
  `;
}

function renderAuditBody(){
  if(!state.auditResults){
    return `<div class="cbf-hint">Compara os relatórios com o que já foi lançado e mostra o que ainda falta cada vendedor registrar. Pode demorar alguns segundos.</div>`;
  }
  const list = state.auditResults;
  const total = list.reduce((s,m)=>s+m.valor,0);
  if(list.length === 0){
    return `<div class="cbf-result ok" style="margin-top:8px;">✓ Nenhuma pendência — tudo que bonifica já foi lançado.</div>`;
  }
  const shown = list.slice(0,300);
  const rowsHtml = shown.map(m=>`
    <tr>
      <td class="mono-name">${escHtml(m.nome)} <span class="cbf-hint">${escHtml(m.vcodigo)}</span></td>
      <td class="mono-name">${CATS[m.categoria].num}</td>
      <td>${escHtml(m.seq)}</td>
      <td class="mono-name" title="${escAttr(m.item)}">${escHtml(m.item.slice(0,26))}${m.item.length>26?'…':''}</td>
      <td>${fmtBRL(m.valor)}</td>
    </tr>
  `).join('');
  return `
    <div class="cbf-pending-note" style="margin-top:8px;">${list.length} pendência(s) — total esperado ${fmtBRL(total)}${list.length>300?' (mostrando as primeiras 300)':''}.</div>

    <table><thead><tr><th>Vendedor</th><th>Cat.</th><th>SEQ</th><th>Item</th><th>Valor esperado</th></tr></thead><tbody>${rowsHtml}</tbody></table>
  `;
}

// ---------- handlers ----------
function attachHandlers(){
  document.getElementById('tabVendedor').onclick = ()=>{ state.currentTab='vendedor'; render(); };
  document.getElementById('tabAdmin').onclick = async ()=>{
    state.currentTab='admin';
    if(state.adminUnlocked) await loadEntries();
    render();
  };

  if(state.currentTab==='vendedor'){
    if(!state.currentSellerCode){
      const inp = document.getElementById('sellerCodeInput');
      const btn = document.getElementById('sellerCodeBtn');
      const tryEnter = async ()=>{
        const code = (inp.value||'').trim();
        if(!code) return;
        const found = state.sellers.find(s => norm(s.codigo) === norm(code));
        if(found){ state.currentSellerCode = found.codigo; await loadEntries(); render(); }
        else{ document.getElementById('sellerCodeErr').textContent = 'Código não encontrado. Confira com o admin.'; }
      };
      if(btn) btn.onclick = tryEnter;
      if(inp){ inp.onkeydown = (ev)=>{ if(ev.key==='Enter') tryEnter(); }; inp.focus(); }
      return;
    }
    const trocar = document.getElementById('trocarVendedorBtn');
    if(trocar) trocar.onclick = ()=>{ state.currentSellerCode=''; render(); };
    Object.keys(CATS).forEach(tipo=>{
      const input = document.getElementById('seqInput-'+tipo);
      const btn = document.getElementById('seqBtn-'+tipo);
      const submit = ()=> submitSeq(tipo);
      if(btn) btn.onclick = submit;
      if(input) input.onkeydown = (ev)=>{ if(ev.key==='Enter') submit(); };
    });
  } else {
    if(!state.adminUnlocked){
      const btn = document.getElementById('adminUnlockBtn');
      const inp = document.getElementById('adminPass');
      const tryUnlock = async ()=>{
        if(inp.value.trim() === ADMIN_PASSWORD){ state.adminUnlocked = true; await loadEntries(); render(); }
        else{ document.getElementById('adminErr').textContent = 'Senha incorreta.'; }
      };
      if(btn) btn.onclick = tryUnlock;
      if(inp) inp.onkeydown = (ev)=>{ if(ev.key==='Enter') tryUnlock(); };
    } else {
      document.querySelectorAll('[data-save]').forEach(b=>{ b.onclick = ()=> saveAdminField(b.getAttribute('data-save')); });
      document.querySelectorAll('[data-del]').forEach(b=>{ b.onclick = ()=> deleteEntry(b.getAttribute('data-del')); });
      document.querySelectorAll('[data-approve]').forEach(b=>{ b.onclick = ()=> approveEntry(b.getAttribute('data-approve')); });
      const auditBtn = document.getElementById('runAuditBtn');
      if(auditBtn) auditBtn.onclick = ()=>{
        state.auditRunning = true; render();
        setTimeout(()=>{
          state.auditResults = runAudit();
          state.auditRunning = false;
          render();
        }, 30);
      };
      const exportAuditBtn = document.getElementById('exportAuditBtn');
      if(exportAuditBtn) exportAuditBtn.onclick = exportAuditCSV;
      const vendasPdfInput = document.getElementById('vendasPdfInput');
      if(vendasPdfInput) vendasPdfInput.onchange = ()=>{
        const f = vendasPdfInput.files && vendasPdfInput.files[0];
        state.vendasPdfName = f ? f.name : '';
        const lbl = document.getElementById('vendasPdfNameLabel');
        if(lbl) lbl.innerHTML = f ? ('📄 ' + escHtml(f.name)) : '';
      };
      const vendasPdfBtn = document.getElementById('vendasPdfBtn');
      if(vendasPdfBtn) vendasPdfBtn.onclick = processVendasPdf;
      const cfPdfInput = document.getElementById('cfPdfInput');
      if(cfPdfInput) cfPdfInput.onchange = ()=>{
        const f = cfPdfInput.files && cfPdfInput.files[0];
        state.cfPdfName = f ? f.name : '';
        const lbl = document.getElementById('cfPdfNameLabel');
        if(lbl) lbl.innerHTML = f ? ('📄 ' + escHtml(f.name)) : '';
      };
      const cfPdfBtn = document.getElementById('cfPdfBtn');
      if(cfPdfBtn) cfPdfBtn.onclick = processCFPdf;

      if(fVend) fVend.onchange = ()=>{ state.adminFilterVendedor = fVend.value; render(); };
      const fCat = document.getElementById('filterCategoriaSelect');
      if(fCat) fCat.onchange = ()=>{ state.adminFilterCategoria = fCat.value; render(); };

      if(reloadBtn) reloadBtn.onclick = async ()=>{ state.adminStatus='Recarregando...'; render(); await loadReferenceData(); await loadEntries(); state.adminStatus='✓ Dados recarregados.'; render(); };
      const recBtn = document.getElementById('reconcileBtn');
      if(recBtn) recBtn.onclick = async ()=>{ state.adminStatus='Reprocessando...'; render(); await reconcileAll(); state.adminStatus='✓ Pendentes reprocessadas.'; render(); };
      const exp = document.getElementById('exportBtn');
      if(exp) exp.onclick = exportCSV;
      const close = document.getElementById('closeMonthBtn');
      if(close) close.onclick = closeMonth;
      const saveSettings = document.getElementById('saveSettingsBtn');
      if(saveSettings) saveSettings.onclick = async ()=>{
        state.settings.descontoMax = parseValor(document.getElementById('descontoMaxInput').value) || 0;
        state.settings.valorCF = parseValor(document.getElementById('valorCFInput').value) || 0;
        state.settings.valorBaleiaEspecial = parseValor(document.getElementById('valorBaleiaEspecialInput').value) || 0;
        state.settings.xrDescontoMin = parseValor(document.getElementById('xrDescontoMinInput').value) || 0;
        state.settings.xrDescontoMax = parseValor(document.getElementById('xrDescontoMaxInput').value) || 0;
        const { error } = await supabase.from('settings').update({
          desconto_max: state.settings.descontoMax,
          valor_cf: state.settings.valorCF,
          valor_baleia_especial: state.settings.valorBaleiaEspecial,
          xr_desconto_min: state.settings.xrDescontoMin,
          xr_desconto_max: state.settings.xrDescontoMax
        }).eq('id',1);
        if(error){ lastError = error.message; state.adminStatus = '✗ Falha ao salvar configurações. Detalhe: ' + lastError; }
        else{ await reconcileAll(); state.adminStatus = '✓ Configurações salvas.'; }
        render();
      };
    }
  }
}

async function submitSeq(tipo){
  const input = document.getElementById('seqInput-'+tipo);
  const resultEl = document.getElementById('seqResult-'+tipo);
  const lens = document.getElementById('lensRing-'+tipo);
  const seq = (input.value||'').trim();
  if(!seq) return;

  await loadEntries();

  lens.classList.remove('ok','warn','err');
  void lens.offsetWidth;
  lens.classList.add('pulse');
  setTimeout(()=>lens.classList.remove('pulse'), 500);

  const lensClassFor = (status)=> status==='resolved' ? 'ok' : (status==='rejected'||status==='wrong_report' ? 'err' : 'warn');
  const messageFor = (e)=>{
    switch(e.status){
      case 'resolved': return fmtBRL(e.total) + ' — ' + (e.detalhes||[]).map(d=>d.ref).join(' + ');
      case 'pending': return 'SEQ registrada — aguardando o relatório do mês para confirmar o valor.';
      case 'rejected': return e.note;
      case 'wrong_report': return e.note;
      case 'no_bonus': return 'SEQ encontrada, mas não bonifica nesta categoria.' + (e.note ? ' ' + e.note : '');
      default: return '';
    }
  };

  const myCode = state.currentSellerCode;
  const already = state.entries.find(e => e.tipo===tipo && norm(e.seq)===norm(seq) && norm(e.vcodigo)===norm(myCode));
  if(already){
    lens.classList.add(lensClassFor(already.status));
    resultEl.className = 'cbf-result ' + (already.status==='resolved'?'ok':(already.status==='rejected'?'err':'warn'));
    resultEl.textContent = 'Já registrada em ' + dateStr(already.ts) + '. ' + messageFor(already);
    input.value=''; input.focus();
    return;
  }

  let entry = { id: Date.now()+'-'+Math.random().toString(36).slice(2), tipo, seq, vcodigo: myCode, ts: Date.now() };
  entry = recomputeEntry(entry);

  if(entry.status === 'wrong_report'){
    lens.classList.add('err');
    resultEl.className = 'cbf-result err';
    resultEl.textContent = entry.note;
    input.value=''; input.focus();
    return;
  }

  const { error } = await supabase.from('entries').insert([entry]);
  if(error){
    resultEl.className = 'cbf-result err';
    resultEl.textContent = 'Falha ao salvar: ' + error.message;
    return;
  }
  state.entries.push(entry);

  lens.classList.add(lensClassFor(entry.status));
  resultEl.className = 'cbf-result ' + (entry.status==='resolved'?'ok':(entry.status==='rejected'?'err':'warn'));
  resultEl.textContent = messageFor(entry);
  input.value='';
  render();
  setTimeout(()=>{ const i=document.getElementById('seqInput-'+tipo); if(i) i.focus(); }, 0);
}

// ---------- PDF import (Vendas / CF) ----------
async function extractPdfLines(file){
  const pdfjsLib = await getPdfjsLib();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const allLines = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items.filter(it => it.str !== undefined);
    const sorted = [...items].sort((a,b)=> b.transform[5]-a.transform[5] || a.transform[4]-b.transform[4]);
    const rows = [];
    let current = null, currentY = null;
    sorted.forEach(it=>{
      const y = it.transform[5];
      if(current === null || Math.abs(y - currentY) > 2){
        if(current) rows.push(current);
        current = [it]; currentY = y;
      } else {
        current.push(it);
      }
    });
    if(current) rows.push(current);
    rows.forEach(row=>{
      row.sort((a,b)=>a.transform[4]-b.transform[4]);
      let line = ''; let lastEnd = null;
      row.forEach(it=>{
        const x = it.transform[4];
        if(lastEnd !== null && (x - lastEnd) > 2) line += ' ';
        line += it.str;
        lastEnd = x + (it.width || it.str.length * 4);
      });
      allLines.push(line);
    });
  }
  return allLines;
}

function parseVendasPdfLines(lines){
  const headerRe = /^Seq\.\s+Data\s+Vendedor\s+Cliente/;
  const dataRe = /^\s*(\d+)\s+(\d{2}\/\d{2}\/\d{4})\s+(\d+)\s+(.+?)\s*$/;
  const productRe = /^\s*([A-Z0-9]{5,})\s+(.+?)\s+([\d.]+,\d{2})\s+([\d.]+,\d{2})\s+([\d.]+,\d{2})\s+([\d.]+,\d{2})\s+([\d.]+,\d{2})\s*$/;
  const contRe = /^\s*(\d+)(?:\s+(\S.*))?\s*$/;

  const records = [];
  let currentSeq = null, currentCode = null, expectData = false;
  for(let i=0; i<lines.length; i++){
    const line = lines[i];
    if(headerRe.test(line)){ expectData = true; continue; }
    if(expectData){
      if(line.trim() === '') continue;
      const m = line.match(dataRe);
      if(m){ currentSeq = m[1]; currentCode = m[3]; }
      expectData = false;
      continue;
    }
    const m = line.match(productRe);
    if(m && currentSeq){
      let [, codigo, descricao, , , , , pct] = m;
      descricao = descricao.trim();
      if(codigo.startsWith('LSA') && codigo.length < 10 && i+1 < lines.length){
        const nxt = lines[i+1];
        const mc = nxt.match(contRe);
        const deficit = 10 - codigo.length;
        if(mc && mc[1].length === deficit){
          codigo = codigo + mc[1];
          if(mc[2]) descricao = (descricao + ' ' + mc[2].trim()).trim();
          i++;
        }
      }
      records.push({ seq: currentSeq, vcodigo: currentCode, produto: codigo, descricao, pct });
    }
  }
  return records;
}

function parseCFPdfLines(lines){
  const seqRe = /^Seq\.\s*Centr\.:\s*(\d+)/;
  const vendRe = /Vendedor:\s*(\d+)\s+(.+?)\s*$/;
  const prodRe = /^\s*([A-Z0-9]{5,})\s+(.+?)\s+(\d+)\s+(\S+)\s+(\S+)\s+([\d.]+,\d{2})\s+([\d.]+,\d{2})\s+([\d.]+,\d{2})\s*$/;
  const records = [];
  let currentSeq = null, currentCode = null, ordem = 0;
  for(const line of lines){
    let m = line.match(seqRe);
    if(m){ currentSeq = m[1]; currentCode = null; continue; }
    if(currentCode === null && line.includes('Vendedor:')){
      const vm = line.match(vendRe);
      if(vm) currentCode = vm[1];
      continue;
    }
    m = line.match(prodRe);
    if(m && currentSeq && currentCode){
      const [, codigo, descricao] = m;
      const qtde = m[6];
      records.push({ ordem: ordem++, seq: currentSeq, vcodigo: currentCode, produto: codigo, descricao: descricao.trim(), qtde });
    }
  }
  return records;
}

async function processVendasPdf(){
  const inp = document.getElementById('vendasPdfInput');
  const f = inp && inp.files && inp.files[0];
  if(!f){ alert('Selecione o arquivo PDF do relatório de Vendas primeiro.'); return; }
  state.vendasPdfName = f.name;
  state.adminStatus = 'Lendo ' + f.name + '... pode levar alguns segundos em relatórios grandes.';
  render();
  try{
    const lines = await extractPdfLines(f);
    const records = parseVendasPdfLines(lines);
    if(records.length === 0){
      state.adminStatus = '✗ Não encontrei nenhuma linha reconhecível nesse PDF. Confira se é o relatório de Vendas certo (' + f.name + ').';
      render();
      return;
    }
    const csv = records.map(r=>[r.seq, r.vcodigo, r.produto, r.descricao, r.pct].join(';')).join('\n');
    state.adminStatus = '✓ PDF "' + f.name + '" processado — ' + records.length + ' linhas encontradas. Revise abaixo e clique em Salvar pra confirmar.';
    render();
    const ta = document.getElementById('refVendasText');
    if(ta) ta.value = csv;
  }catch(err){
    state.adminStatus = '✗ Erro ao processar "' + f.name + '": ' + (err && err.message ? err.message : err);
    render();
  }
}

function runAudit(){
  const bySeqVendas = {};
  state.refVendas.forEach(r=>{ const k=norm(r.seq); (bySeqVendas[k]=bySeqVendas[k]||[]).push(r); });
  const bySeqCF = {};
  state.refCF.forEach(r=>{ const k=norm(r.seq); (bySeqCF[k]=bySeqCF[k]||[]).push(r); });

  const loggedLentes = new Set(), loggedBaleia = new Set(), loggedCF = new Set();
  state.entries.forEach(e=>{
    if(e.status==='resolved' || e.manual){
      const key = norm(e.seq)+'|'+norm(e.vcodigo);
      if(e.tipo==='lentes') loggedLentes.add(key);
      else if(e.tipo==='baleia') loggedBaleia.add(key);
      else loggedCF.add(key);
    }
  });

  const missing = [];

  Object.keys(bySeqVendas).forEach(seqKey=>{
    const rows = bySeqVendas[seqKey];
    const vcodigo = rows[0].vcodigo;
    const seq = rows[0].seq;
    const key = seqKey + '|' + norm(vcodigo);

    if(!loggedLentes.has(key)){
      const { detalhes, itens } = computeLentesBonus(rows);
      const total = detalhes.reduce((s,d)=>s+d.valor,0);
      if(total > 0) missing.push({ seq, vcodigo, nome: nomeDoVendedor(vcodigo), categoria:'lentes', catLabel: CATS.lentes.label, valor: total, item: itens.join(' + ') });
    }

    if(!loggedBaleia.has(key)){
      const { detalhes, itens } = computeBaleiaBonus(rows, vcodigo);
      const total = detalhes.reduce((s,d)=>s+d.valor,0);
      if(total > 0) missing.push({ seq, vcodigo, nome: nomeDoVendedor(vcodigo), categoria:'baleia', catLabel: CATS.baleia.label, valor: total, item: itens.join(' + ') });
    }
  });

  Object.keys(bySeqCF).forEach(seqKey=>{
    const rows = [...bySeqCF[seqKey]].sort((a,b)=>a.ordem-b.ordem);
    const vcodigo = rows[0].vcodigo;
    const seq = rows[0].seq;
    const key = seqKey + '|' + norm(vcodigo);
    if(!loggedCF.has(key)){
      const { pares } = computeCFBonus(rows);
      if(pares > 0) missing.push({ seq, vcodigo, nome: nomeDoVendedor(vcodigo), categoria:'cf', catLabel: CATS.cf.label, valor: pares*state.settings.valorCF, item: pares+' par(es)' });
    }
  });

  missing.sort((a,b)=> a.nome.localeCompare(b.nome) || Number(a.seq)-Number(b.seq));
  return missing;
}

function exportAuditCSV(){
  if(!state.auditResults) return;
  const rows = [['Vendedor','Código','Categoria','SEQ','Item','Valor esperado']];
  state.auditResults.forEach(m=>{
    rows.push([m.nome, m.vcodigo, m.catLabel, m.seq, m.item, Number(m.valor).toFixed(2).replace('.',',')]);
  });
  const csv = rows.map(r=>r.map(c=>`"${(c??'').toString().replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `auditoria-pendentes-${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function deleteEntry(id){
  const { error } = await supabase.from('entries').delete().eq('id', id);
  if(error){ state.adminStatus = '✗ Falha ao excluir. Detalhe: ' + error.message; render(); return; }
  state.entries = state.entries.filter(e=>e.id!==id);
  render();
}

async function approveEntry(id){
  const entry = state.entries.find(e=>e.id===id);
  if(!entry) return;
  const sugestao = entry.total ? Number(entry.total).toFixed(2).replace('.',',') : '';
  const valorStr = prompt('SEQ ' + entry.seq + ' — valor da bonificação (R$) para aprovar manualmente:', sugestao);
  if(valorStr === null) return; // cancelado
  const valor = parseValor(valorStr);
  const motivo = prompt('Motivo da aprovação manual (opcional, aparece no relatório):', entry.note || '') || '';
  const updated = {
    manual: true,
    status: 'resolved',
    total: valor,
    detalhes: [{ ref: 'Aprovação manual' + (motivo ? ' — ' + motivo : ''), valor }],
    item: 'Aprovação manual',
    note: motivo
  };
  const { error } = await supabase.from('entries').update(updated).eq('id', id);
  if(error){ state.adminStatus = '✗ Falha ao aprovar. Detalhe: ' + error.message; render(); return; }
  Object.assign(entry, updated);
  state.adminStatus = '✓ SEQ ' + entry.seq + ' aprovada manualmente — ' + fmtBRL(valor) + '.';
  render();
}

function exportCSV(){
  const rows = [['Vendedor','Código','Categoria','SEQ','Item','Status','Detalhe','Valor','Data']];
  [...state.entries].sort((a,b)=>a.ts-b.ts).forEach(e=>{
    rows.push([nomeDoVendedor(e.vcodigo), e.vcodigo, CATS[e.tipo]?CATS[e.tipo].label:e.tipo, e.seq, e.item||'', statusLabel(e.status, e.manual).text, (e.detalhes||[]).map(d=>d.ref).join(' | '), Number(e.total).toFixed(2).replace('.',','), new Date(e.ts).toLocaleDateString('pt-BR')]);
  });
  const csv = rows.map(r=>r.map(c=>`"${(c??'').toString().replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `bonificacao-${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function closeMonth(){
  if(!confirm('Isso vai arquivar os lançamentos atuais e zerar a lista para o próximo mês. Confirma?')) return;
  await loadEntries();
  const archiveId = 'archive-' + now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + Date.now();
  const { error: e1 } = await supabase.from('archives').insert([{ id: archiveId, entries: state.entries }]);
  if(e1){ state.adminStatus = '✗ Falha ao arquivar. Detalhe: ' + e1.message; render(); return; }
  const ok = await deleteAll('entries', 'id');
  if(!ok){ state.adminStatus = '✗ Arquivado, mas falhou ao zerar lançamentos. Detalhe: ' + lastError; render(); return; }
  state.entries = [];
  state.auditResults = null;
  state.adminStatus = '✓ Mês fechado e arquivado.';
  render();
}
